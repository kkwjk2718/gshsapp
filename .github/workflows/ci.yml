name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  AUTH_SECRET: ci-only-auth-secret-material-over-32-bytes
  AUTH_TRUST_HOST: "true"
  AUTH_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: file:./prisma/dev.db
  NEXT_PUBLIC_NEIS_API_KEY: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test

  firewall-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate host firewall policy scripts
        run: |
          bash -n deploy/host-hardening.sh deploy/host-hardening.test.sh deploy/runner-job-policy.sh deploy/runner-job-policy.test.sh deploy/install-runner-trust-hook.sh deploy/verify-runner-trust-hook.sh deploy/runner-trust-hook.test.sh
          bash -n deploy/deploy-policy.sh deploy/deploy-policy.test.sh docker-entrypoint.sh
          bash deploy/deploy-policy.test.sh
          python3 -m unittest deploy/validate_ufw_rules_test.py
          bash deploy/host-hardening.test.sh
          bash deploy/runner-job-policy.test.sh
          bash deploy/runner-trust-hook.test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
