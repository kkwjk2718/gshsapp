name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  AUTH_SECRET: ci-only-auth-secret-material-over-32-bytes
  AUTH_TRUST_HOST: "true"
  AUTH_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: file:./prisma/dev.db
  NEXT_PUBLIC_NEIS_API_KEY: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Exercise first-deployment backup boundary
        run: |
          npm run build:ops
          python3 -m py_compile deploy/*.py
          python3 -m unittest deploy/bootstrap_backup_test.py
          python3 -m unittest deploy/validate_live_database_test.py deploy/validate_operations_config_test.py deploy/validate_docker_network_test.py deploy/validate_host_routes_test.py
          node scripts/generate-control-assets-manifest.mjs --check
          node scripts/control-assets-manifest.test.mjs
          bash -n deploy/*.sh docker-entrypoint.sh
          bash deploy/deploy-quiescence.test.sh
          bash deploy/predeployment-backup.test.sh
          bash deploy/import-backup.test.sh
          bash deploy/restore-drill.test.sh
          bash deploy/root-operations-bootstrap.test.sh
          sudo -n bash deploy/control-update-recovery.test.sh
          sudo -n bash deploy/offsite-mount-pin.test.sh
          bash deploy/approve-release.test.sh

  firewall-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate host firewall policy scripts
        run: |
          bash -n deploy/*.sh docker-entrypoint.sh
          bash deploy/deploy-policy.test.sh
          python3 -m unittest deploy/validate_ufw_rules_test.py
          bash deploy/host-hardening.test.sh
          bash deploy/docker-user-firewall.test.sh
          bash deploy/backup-writer-recovery.test.sh
          bash deploy/writer-boot-recovery.test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
