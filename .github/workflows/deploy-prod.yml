name: Production Release Verification

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image version already installed by the trusted operator (sha- plus 40 lowercase hex characters)
        required: true
        type: string
      image_digest:
        description: Exact published image digest (sha256 followed by 64 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-verification
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/kkwjk2718git/gshsapp
  PREPRODUCTION_URL: https://test.gshs.app
  E2E_BASE_URL: https://gshs.app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      image_tag: ${{ steps.provenance.outputs.image_tag }}
      image_digest: ${{ steps.provenance.outputs.image_digest }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      control_sha: ${{ steps.provenance.outputs.control_sha }}
    steps:
      - name: Check out trusted verification controls from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Verify candidate commit and signed image provenance
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REQUESTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          TRUSTED_CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG_INPUT" =~ ^sha-[0-9a-f]{40}$ ]] || {
            echo "image_tag must be sha- followed by 40 lowercase hexadecimal characters." >&2
            exit 1
          }
          export CANDIDATE_SHA="${IMAGE_TAG_INPUT#sha-}"
          bash ./deploy/verify-image-provenance.sh

  preproduction_health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: candidate
    steps:
      - name: Require the exact candidate on the public test origin
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.candidate.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.candidate.outputs.image_digest }}
          PUBLIC_BASE_URL: ${{ env.PREPRODUCTION_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base_url = os.environ["PUBLIC_BASE_URL"].rstrip("/")
          expected_origin = urllib.parse.urlsplit(base_url)
          request = urllib.request.Request(
              base_url + "/api/health",
              headers={"User-Agent": "gshsapp-production-preflight"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              actual = urllib.parse.urlsplit(response.geturl())
              if (actual.scheme, actual.hostname, actual.port) != (
                  expected_origin.scheme,
                  expected_origin.hostname,
                  expected_origin.port,
              ):
                  raise SystemExit("Preproduction request escaped the expected origin")
              body = response.read(65537)
              status = response.status

          if len(body) > 65536 or status != 200:
              raise SystemExit("Preproduction health response is invalid")
          payload = json.loads(body.decode("utf-8"))
          if payload.get("ok") is not True or payload.get("service") != "gshsapp":
              raise SystemExit("Preproduction is unhealthy")
          if payload.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Preproduction is not serving the requested candidate version")
          if payload.get("imageDigest") != os.environ["EXPECTED_IMAGE_DIGEST"]:
              raise SystemExit("Preproduction is not serving the requested image digest")
          PY

  production_health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - candidate
      - preproduction_health
    environment:
      name: production-verification
      url: https://gshs.app
    steps:
      - name: Verify the exact candidate on the public production origin
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.candidate.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.candidate.outputs.image_digest }}
          PUBLIC_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base_url = os.environ["PUBLIC_BASE_URL"].rstrip("/")
          expected_origin = urllib.parse.urlsplit(base_url)
          health = None

          for path in ("/api/health", "/", "/menu", "/notices"):
              request = urllib.request.Request(
                  base_url + path,
                  headers={"User-Agent": "gshsapp-production-public-verification"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = urllib.parse.urlsplit(response.geturl())
                  if (actual.scheme, actual.hostname, actual.port) != (
                      expected_origin.scheme,
                      expected_origin.hostname,
                      expected_origin.port,
                  ):
                      raise SystemExit(f"Public request escaped the expected origin for {path}")
                  body = response.read(65537)
                  status = response.status

              if len(body) > 65536:
                  raise SystemExit(f"{path} response exceeded the verification limit")
              if status < 200 or status >= 400:
                  raise SystemExit(f"{path} returned status {status}")
              if path == "/api/health":
                  health = json.loads(body.decode("utf-8"))

          if health is None or health.get("ok") is not True or health.get("service") != "gshsapp":
              raise SystemExit("Production health response is invalid")
          if health.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Production is not serving the requested candidate version")
          if health.get("imageDigest") != os.environ["EXPECTED_IMAGE_DIGEST"]:
              raise SystemExit("Production is not serving the requested image digest")
          PY

  public_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - candidate
      - production_health
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run anonymous public-page verification
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: npx playwright test e2e/public.spec.ts

  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - candidate
      - preproduction_health
      - production_health
      - public_e2e
    permissions:
      contents: read
    steps:
      - name: Check out the exact deployed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create exact production-verification proof
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.source_sha }}
          CONTROL_SHA: ${{ needs.candidate.outputs.control_sha }}
          IMAGE_TAG: ${{ needs.candidate.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.candidate.outputs.image_digest }}
          PROOF_PATH: ${{ runner.temp }}/production-proof.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os
          proof = {
              "format": "gshsapp-production-public-proof",
              "version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": ".github/workflows/deploy-prod.yml",
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "candidateSha": os.environ["CANDIDATE_SHA"],
              "controlSha": os.environ["CONTROL_SHA"],
              "imageTag": os.environ["IMAGE_TAG"],
              "imageDigest": os.environ["IMAGE_DIGEST"],
              "verifiedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }
          with open(os.environ["PROOF_PATH"], "x", encoding="utf-8", newline="\n") as output:
              json.dump(proof, output, separators=(",", ":"))
              output.write("\n")
          PY
      - name: Publish exact production-verification proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-proof.json
          if-no-files-found: error
          retention-days: 7

  report:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - candidate
      - preproduction_health
      - production_health
      - public_e2e
      - proof
    steps:
      - name: Record release verification result
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PREPRODUCTION_RESULT: ${{ needs.preproduction_health.result }}
          PRODUCTION_RESULT: ${{ needs.production_health.result }}
          E2E_RESULT: ${{ needs.public_e2e.result }}
          PROOF_RESULT: ${{ needs.proof.result }}
          IMAGE_TAG: ${{ needs.candidate.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.candidate.outputs.image_digest }}
        run: |
          set -euo pipefail
          {
            echo "## Production Release Verification"
            echo
            echo "- Candidate: ${IMAGE_TAG:-unavailable}"
            echo "- Image digest: ${IMAGE_DIGEST:-unavailable}"
            echo "- Provenance result: $CANDIDATE_RESULT"
            echo "- Preproduction public result: $PREPRODUCTION_RESULT"
            echo "- Production public result: $PRODUCTION_RESULT"
            echo "- Anonymous browser result: $E2E_RESULT"
            echo "- Privileged release handoff proof: $PROOF_RESULT"
            echo "- Host deployment mutation performed: no"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$CANDIDATE_RESULT" == "success" ]]
          [[ "$PREPRODUCTION_RESULT" == "success" ]]
          [[ "$PRODUCTION_RESULT" == "success" ]]
          [[ "$E2E_RESULT" == "success" ]]
          [[ "$PROOF_RESULT" == "success" ]]
