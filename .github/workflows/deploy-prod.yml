name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image version (sha- followed by the 40-hex commit)
        required: true
        type: string
      image_digest:
        description: Exact published image digest (sha256:<64 hex>)
        required: true
        type: string
      rehearsal_run_id:
        description: Successful Preproduction Rehearsal workflow run ID for this exact image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_URL: https://gshs.app
  E2E_BASE_URL: https://gshs.app
  DEPLOY_PATH: /opt/gshsapp
  IMAGE_REPOSITORY: docker.io/kkwjk2718git/gshsapp
  DOCKER_IMAGE: kkwjk2718git/gshsapp
  BACKUP_MAX_AGE_HOURS: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      actions: read
    outputs:
      image_tag: ${{ steps.provenance.outputs.image_tag }}
      image_digest: ${{ steps.provenance.outputs.image_digest }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      control_sha: ${{ steps.provenance.outputs.control_sha }}
      rehearsal_run_id: ${{ steps.rehearsal.outputs.rehearsal_run_id }}
    steps:
      - name: Check out trusted deployment controls from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Verify candidate commit and signed image provenance
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REQUESTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          TRUSTED_CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG_INPUT" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "image_tag must be sha-<40 lowercase hex>." >&2; exit 1; }
          export CANDIDATE_SHA="${IMAGE_TAG_INPUT#sha-}"
          bash ./deploy/verify-image-provenance.sh
      - id: rehearsal
        name: Verify successful rehearsal proof for this image
        shell: bash
        env:
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
          CANDIDATE_SHA: ${{ steps.provenance.outputs.source_sha }}
          REQUESTED_IMAGE_DIGEST: ${{ steps.provenance.outputs.image_digest }}
          CONTROL_SHA: ${{ steps.provenance.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./deploy/verify-rehearsal-proof.sh

  preflight:
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: production
    steps:
      - name: Require operator security attestations
        shell: bash
        env:
          SECURITY_ROTATION_COMPLETE: ${{ vars.SECURITY_ROTATION_COMPLETE }}
          ORIGIN_FIREWALL_READY: ${{ vars.ORIGIN_FIREWALL_READY }}
          OFFSITE_BACKUP_READY: ${{ vars.OFFSITE_BACKUP_READY }}
        run: |
          set -euo pipefail
          for variable in SECURITY_ROTATION_COMPLETE ORIGIN_FIREWALL_READY OFFSITE_BACKUP_READY; do
            [[ "${!variable:-}" == "true" ]] || { echo "$variable must be true in the protected production environment." >&2; exit 1; }
          done
      - name: Verify the candidate is healthy on preproduction
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://test.gshs.app/api/health",
              headers={"User-Agent": "gshsapp-production-preflight"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read(65537).decode("utf-8"))
          if response.status != 200 or payload.get("ok") is not True:
              raise SystemExit(f"Preproduction is unhealthy: {payload}")
          if payload.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Preproduction is not running the candidate: {payload}")
          if payload.get("imageDigest") != os.environ["EXPECTED_IMAGE_DIGEST"]:
              raise SystemExit("Preproduction is not running the exact verified image digest")
          PY

  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gshs-prod
    needs:
      - prepare
      - preflight
    environment:
      name: production
      url: https://gshs.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - name: Sync deploy assets on production server
        shell: bash
        run: |
          set -euo pipefail
          install -d "$DEPLOY_PATH" "$DEPLOY_PATH/data" "$DEPLOY_PATH/backup"
          install -m 644 deploy/compose.yml "$DEPLOY_PATH/compose.yml"
          install -m 755 deploy/deploy.sh "$DEPLOY_PATH/deploy.sh"
          install -m 644 deploy/deploy-policy.sh "$DEPLOY_PATH/deploy-policy.sh"
          install -m 755 deploy/host-hardening.sh "$DEPLOY_PATH/host-hardening.sh"
          install -m 644 deploy/validate-ufw-rules.py "$DEPLOY_PATH/validate-ufw-rules.py"
          install -m 755 deploy/offsite-backup.sh "$DEPLOY_PATH/offsite-backup.sh"
          install -m 755 deploy/run-scheduled-backup.sh "$DEPLOY_PATH/run-scheduled-backup.sh"
          install -m 755 deploy/predeployment-backup.sh "$DEPLOY_PATH/predeployment-backup.sh"
          install -m 755 deploy/bootstrap-backup.py "$DEPLOY_PATH/bootstrap-backup.py"
          install -m 755 deploy/restore-drill.sh "$DEPLOY_PATH/restore-drill.sh"
      - name: Deploy production server
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          EXPECTED_APP_ORIGIN: https://gshs.app
          BACKUP_MAX_AGE_HOURS: ${{ env.BACKUP_MAX_AGE_HOURS }}
          HOST_BIND_IP: ${{ vars.HOST_BIND_IP }}
          ALLOW_PUBLIC_BIND: ${{ vars.ALLOW_PUBLIC_BIND }}
          REQUIRE_EXPLICIT_BIND: "true"
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
          export DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN"
          export IMAGE_TAG="$IMAGE_TAG"
          export IMAGE_DIGEST="$IMAGE_DIGEST"
          export EXPECTED_APP_ORIGIN="$EXPECTED_APP_ORIGIN"
          export APP_VERSION="$IMAGE_TAG"
          export BACKUP_MAX_AGE_HOURS="$BACKUP_MAX_AGE_HOURS"
          export HOST_BIND_IP="$HOST_BIND_IP"
          export ALLOW_PUBLIC_BIND="$ALLOW_PUBLIC_BIND"
          export REQUIRE_EXPLICIT_BIND="$REQUIRE_EXPLICIT_BIND"
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          ./deploy.sh

  smoke:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gshs-prod
    needs:
      - prepare
      - deploy
    outputs:
      health_version: ${{ steps.smoke.outputs.health_version }}
    steps:
      - id: smoke
        name: Smoke check production deployment on server
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          SMOKE_HOST: ${{ vars.HOST_BIND_IP }}
        run: |
          set -euo pipefail
          health_version="$(
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" python3 - <<'PY'
          import json
          import ipaddress
          import os
          import urllib.request

          smoke_host = os.environ["SMOKE_HOST"]
          ipaddress.ip_address(smoke_host)
          base_url = f"http://{smoke_host}:1234"
          expected_version = os.environ["EXPECTED_VERSION"]
          paths = ["/api/health", "/", "/menu", "/notices"]

          for path in paths:
              request = urllib.request.Request(
                  base_url + path,
                  headers={"User-Agent": "gshsapp-ci-smoke-check"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  status = response.status

              if status < 200 or status >= 400:
                  raise SystemExit(f"{path} returned status {status}")

              if path == "/api/health":
                  payload = json.loads(body.decode("utf-8"))
                  if payload.get("ok") is not True:
                      raise SystemExit(f"Health endpoint returned unhealthy payload: {payload}")
                  if payload.get("service") != "gshsapp":
                      raise SystemExit(f"Unexpected service name: {payload}")
                  if payload.get("version") != expected_version:
                      raise SystemExit(
                          f"Health endpoint version mismatch: expected {expected_version}, got {payload.get('version')}"
                      )
                  if payload.get("imageDigest") != os.environ["EXPECTED_IMAGE_DIGEST"]:
                      raise SystemExit("Health endpoint image digest does not match the verified image")

          print(payload["version"])
          PY
          )"

          echo "health_version=$health_version" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - deploy
      - smoke
    environment:
      name: production
      url: ${{ env.APP_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for production domain to serve deployed version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" E2E_BASE_URL="$E2E_BASE_URL" python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ["E2E_BASE_URL"].rstrip("/")
          expected_version = os.environ["EXPECTED_VERSION"]
          deadline = time.time() + 180

          while time.time() < deadline:
              request = urllib.request.Request(
                  base_url + "/api/health",
                  headers={"User-Agent": "gshsapp-production-e2e"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if (
                      payload.get("version") == expected_version
                      and payload.get("imageDigest") == os.environ["EXPECTED_IMAGE_DIGEST"]
                      and payload.get("ok") is True
                  ):
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit(
                  f"Timed out waiting for {base_url}/api/health to report version {expected_version}"
              )
          PY
      - name: Run production Playwright smoke suite
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e:smoke

  report:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - deploy
      - smoke
      - e2e
    steps:
      - name: Write production deployment summary
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          REHEARSAL_RUN_ID: ${{ needs.prepare.outputs.rehearsal_run_id }}
          HEALTH_VERSION: ${{ needs.smoke.outputs.health_version }}
        run: |
          set -euo pipefail
          {
            echo "## Production Deployment"
            echo
            echo "- Deployment SHA: $IMAGE_TAG"
            echo "- Verified image digest: $IMAGE_DIGEST"
            echo "- Verified rehearsal run: $REHEARSAL_RUN_ID"
            echo "- Health version: ${HEALTH_VERSION:-n/a}"
            echo "- Deploy result: $DEPLOY_RESULT"
            echo "- Smoke result: $SMOKE_RESULT"
            echo "- Playwright smoke result: $E2E_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_RESULT" != "success" || "$SMOKE_RESULT" != "success" || "$E2E_RESULT" != "success" ]]; then
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - deploy
      - smoke
      - e2e
      - report
    if: ${{ needs.deploy.result == 'success' && needs.smoke.result == 'success' && needs.e2e.result == 'success' && needs.report.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: package_version
        name: Read package version
        shell: bash
        run: |
          set -euo pipefail
          package_json="$(git show "${SOURCE_SHA}:package.json")"
          package_version="$(node -e 'const fs=require("node:fs"); const parsed=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(parsed.version)' <<<"$package_json")"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Candidate package version is invalid." >&2; exit 1; }
          printf 'value=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      - name: Create or update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          HEALTH_VERSION: ${{ needs.smoke.outputs.health_version }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TZ: Asia/Seoul
        with:
          script: |
            const imageTag = process.env.IMAGE_TAG;
            const healthVersion = process.env.HEALTH_VERSION || imageTag;
            const packageVersion = process.env.PACKAGE_VERSION;
            const runUrl = process.env.RUN_URL;
            const releaseTag = `v${packageVersion}`;
            const targetCommitish = imageTag.replace(/^sha-/, "");
            const now = new Date();
            const seoulDate = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Seoul",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).format(now);
            const releaseName = `${releaseTag} - ${seoulDate}`;
            const body = [
              `- 서비스 버전: ${releaseTag}`,
              `- 배포 태그: ${imageTag}`,
              `- 헬스 버전: ${healthVersion}`,
              `- 운영 주소: https://gshs.app`,
              `- 배포 실행 기록: ${runUrl}`,
            ].join("\n");

            let existingRelease = null;
            let existingTagRef = null;

            try {
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${releaseTag}`,
              });
              existingTagRef = data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              });
              existingRelease = data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (existingTagRef && !existingRelease) {
              throw new Error(
                `${releaseTag} 태그가 이미 존재합니다. package.json 버전을 먼저 올린 뒤 다시 배포해 주세요.`
              );
            }

            if (existingRelease) {
              const existingBody = existingRelease.body || "";
              const existingImageTag = existingBody.match(/^- 배포 태그: (.+)$/m)?.[1]?.trim();

              if (!existingImageTag) {
                throw new Error(
                  `${releaseTag} 릴리스가 이미 존재하지만 기존 배포 태그를 확인할 수 없습니다. 버전을 새로 올린 뒤 다시 배포해 주세요.`
                );
              }

              if (existingImageTag !== imageTag) {
                throw new Error(
                  `${releaseTag} 릴리스가 이미 ${existingImageTag}에 사용되었습니다. package.json 버전을 먼저 올린 뒤 다시 배포해 주세요.`
                );
              }

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existingRelease.id,
                tag_name: releaseTag,
                name: releaseName,
                body,
                draft: false,
                prerelease: false,
              });
              core.info(`Updated existing release for ${releaseTag}`);
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: releaseTag,
                name: releaseName,
                body,
                draft: false,
                prerelease: false,
                target_commitish: targetCommitish,
                generate_release_notes: false,
              });
              core.info(`Created release for ${releaseTag}`);
            }
