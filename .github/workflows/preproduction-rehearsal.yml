name: Preproduction Rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-hex commit SHA to rehearse on test
        required: true
        type: string
      image_digest:
        description: Exact published image digest (sha256:<64 hex>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preproduction-rehearsal
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/gshsapp
  IMAGE_REPOSITORY: docker.io/kkwjk2718git/gshsapp
  DOCKER_IMAGE: kkwjk2718git/gshsapp
  E2E_BASE_URL: https://test.gshs.app
  RESTORE_DRILL_PORT: "1235"
  BACKUP_MAX_AGE_HOURS: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      image_tag: ${{ steps.provenance.outputs.image_tag }}
      image_digest: ${{ steps.provenance.outputs.image_digest }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      control_sha: ${{ steps.provenance.outputs.control_sha }}
    steps:
      - name: Check out trusted deployment controls from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Verify candidate commit and signed image provenance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUESTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          TRUSTED_CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./deploy/verify-image-provenance.sh

  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gshs-test
    needs: prepare
    environment:
      name: test
      url: ${{ env.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - name: Sync deploy assets on test server
        shell: bash
        run: |
          set -euo pipefail
          install -d "$DEPLOY_PATH" "$DEPLOY_PATH/data" "$DEPLOY_PATH/backup"
          install -m 644 deploy/compose.yml "$DEPLOY_PATH/compose.yml"
          install -m 755 deploy/deploy.sh "$DEPLOY_PATH/deploy.sh"
          install -m 644 deploy/deploy-policy.sh "$DEPLOY_PATH/deploy-policy.sh"
          install -m 755 deploy/host-hardening.sh "$DEPLOY_PATH/host-hardening.sh"
          install -m 644 deploy/validate-ufw-rules.py "$DEPLOY_PATH/validate-ufw-rules.py"
          install -m 755 deploy/offsite-backup.sh "$DEPLOY_PATH/offsite-backup.sh"
          install -m 755 deploy/run-scheduled-backup.sh "$DEPLOY_PATH/run-scheduled-backup.sh"
          install -m 755 deploy/restore-drill.sh "$DEPLOY_PATH/restore-drill.sh"
      - name: Deploy candidate image to test server
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          EXPECTED_APP_ORIGIN: https://test.gshs.app
          BACKUP_MAX_AGE_HOURS: ${{ env.BACKUP_MAX_AGE_HOURS }}
          HOST_BIND_IP: ${{ vars.HOST_BIND_IP }}
          ALLOW_PUBLIC_BIND: ${{ vars.ALLOW_PUBLIC_BIND }}
          REQUIRE_EXPLICIT_BIND: "true"
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
          export DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN"
          export IMAGE_TAG="$IMAGE_TAG"
          export IMAGE_DIGEST="$IMAGE_DIGEST"
          export EXPECTED_APP_ORIGIN="$EXPECTED_APP_ORIGIN"
          export APP_VERSION="$IMAGE_TAG"
          export BACKUP_MAX_AGE_HOURS="$BACKUP_MAX_AGE_HOURS"
          export HOST_BIND_IP="$HOST_BIND_IP"
          export ALLOW_PUBLIC_BIND="$ALLOW_PUBLIC_BIND"
          export REQUIRE_EXPLICIT_BIND="$REQUIRE_EXPLICIT_BIND"
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          ./deploy.sh

  smoke:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gshs-test
    needs:
      - prepare
      - deploy
    outputs:
      health_version: ${{ steps.smoke.outputs.health_version }}
    steps:
      - id: smoke
        name: Smoke check candidate deployment on server
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          SMOKE_HOST: ${{ vars.HOST_BIND_IP }}
        run: |
          set -euo pipefail
          health_version="$(
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" python3 - <<'PY'
          import json
          import ipaddress
          import os
          import urllib.request

          smoke_host = os.environ["SMOKE_HOST"]
          ipaddress.ip_address(smoke_host)
          base_url = f"http://{smoke_host}:1234"
          expected_version = os.environ["EXPECTED_VERSION"]
          paths = ["/api/health", "/", "/menu", "/notices"]
          health_payload = None

          for path in paths:
              request = urllib.request.Request(
                  base_url + path,
                  headers={"User-Agent": "gshsapp-preproduction-smoke"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  status = response.status

              if status < 200 or status >= 400:
                  raise SystemExit(f"{path} returned status {status}")

              if path == "/api/health":
                  health_payload = json.loads(body.decode("utf-8"))
                  if health_payload.get("ok") is not True:
                      raise SystemExit(f"Health endpoint returned unhealthy payload: {health_payload}")
                  if health_payload.get("service") != "gshsapp":
                      raise SystemExit(f"Unexpected service name: {health_payload}")
                  if health_payload.get("version") != expected_version:
                      raise SystemExit(
                          f"Health endpoint version mismatch: expected {expected_version}, got {health_payload.get('version')}"
                      )
                  if health_payload.get("imageDigest") != os.environ["EXPECTED_IMAGE_DIGEST"]:
                      raise SystemExit("Health endpoint image digest does not match the verified image")

          print(health_payload["version"])
          PY
          )"

          echo "health_version=$health_version" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - smoke
    environment:
      name: test
      url: ${{ env.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for test domain to serve candidate version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" E2E_BASE_URL="$E2E_BASE_URL" python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ["E2E_BASE_URL"].rstrip("/")
          expected_version = os.environ["EXPECTED_VERSION"]
          deadline = time.time() + 180

          while time.time() < deadline:
              request = urllib.request.Request(
                  base_url + "/api/health",
                  headers={"User-Agent": "gshsapp-preproduction-e2e"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if (
                      payload.get("version") == expected_version
                      and payload.get("imageDigest") == os.environ["EXPECTED_IMAGE_DIGEST"]
                      and payload.get("ok") is True
                  ):
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit(
                  f"Timed out waiting for {base_url}/api/health to report version {expected_version}"
              )
          PY
      - name: Run Playwright E2E suite
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e

  restore_drill:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gshs-test
    needs:
      - prepare
      - e2e
    environment:
      name: test
      url: ${{ env.E2E_BASE_URL }}
    outputs:
      restore_source_name: ${{ steps.parse.outputs.restore_source_name }}
      latest_backup_name: ${{ steps.parse.outputs.latest_backup_name }}
      restore_version: ${{ steps.parse.outputs.restore_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - name: Sync deploy assets for restore drill
        shell: bash
        run: |
          set -euo pipefail
          install -d "$DEPLOY_PATH" "$DEPLOY_PATH/data" "$DEPLOY_PATH/backup"
          install -m 644 deploy/compose.yml "$DEPLOY_PATH/compose.yml"
          install -m 755 deploy/offsite-backup.sh "$DEPLOY_PATH/offsite-backup.sh"
          install -m 755 deploy/run-scheduled-backup.sh "$DEPLOY_PATH/run-scheduled-backup.sh"
          install -m 755 deploy/restore-drill.sh "$DEPLOY_PATH/restore-drill.sh"
      - name: Run isolated restore drill
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          RESTORE_DRILL_OUTPUT_FILE: ${{ runner.temp }}/restore-drill.env
          RESTORE_DRILL_PORT: ${{ env.RESTORE_DRILL_PORT }}
          BACKUP_MAX_AGE_HOURS: ${{ env.BACKUP_MAX_AGE_HOURS }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
          export DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN"
          export IMAGE_TAG="$IMAGE_TAG"
          export IMAGE_DIGEST="$IMAGE_DIGEST"
          export APP_VERSION="$IMAGE_TAG"
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          ./restore-drill.sh
      - id: parse
        name: Parse restore drill outputs
        shell: bash
        env:
          RESTORE_DRILL_OUTPUT_FILE: ${{ runner.temp }}/restore-drill.env
        run: |
          set -euo pipefail
          if [[ ! -f "$RESTORE_DRILL_OUTPUT_FILE" ]]; then
            echo "Restore drill output file is missing." >&2
            exit 1
          fi
          cat "$RESTORE_DRILL_OUTPUT_FILE" >> "$GITHUB_OUTPUT"

  report:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - deploy
      - smoke
      - e2e
      - restore_drill
    steps:
      - name: Write rehearsal summary
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RESTORE_RESULT: ${{ needs.restore_drill.result }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          HEALTH_VERSION: ${{ needs.smoke.outputs.health_version }}
          RESTORE_SOURCE_NAME: ${{ needs.restore_drill.outputs.restore_source_name }}
          LATEST_BACKUP_NAME: ${{ needs.restore_drill.outputs.latest_backup_name }}
          RESTORE_VERSION: ${{ needs.restore_drill.outputs.restore_version }}
        run: |
          set -euo pipefail
          {
            echo "## Preproduction Rehearsal"
            echo
            echo "- Deployment SHA: $IMAGE_TAG"
            echo "- Verified image digest: $IMAGE_DIGEST"
            echo "- Health version: ${HEALTH_VERSION:-n/a}"
            echo "- Smoke result: $SMOKE_RESULT"
            echo "- E2E result: $E2E_RESULT"
            echo "- Restore drill result: $RESTORE_RESULT"
            echo "- Restore drill version: ${RESTORE_VERSION:-n/a}"
            echo "- Restore source: ${RESTORE_SOURCE_NAME:-n/a}"
            echo "- Latest backup file: ${LATEST_BACKUP_NAME:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_RESULT" != "success" || "$SMOKE_RESULT" != "success" || "$E2E_RESULT" != "success" || "$RESTORE_RESULT" != "success" ]]; then
            exit 1
          fi

  proof:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - report
    permissions:
      contents: read
    steps:
      - name: Create exact rehearsal proof
        shell: bash
        env:
          PROOF_DIRECTORY: ${{ runner.temp }}/preproduction-rehearsal-proof
          CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
        run: |
          set -euo pipefail
          install -d -m 700 "$PROOF_DIRECTORY"
          PROOF_DIRECTORY="$PROOF_DIRECTORY" \
          CONTROL_SHA="$CONTROL_SHA" \
          CANDIDATE_SHA="$CANDIDATE_SHA" \
          IMAGE_TAG="$IMAGE_TAG" \
          IMAGE_DIGEST="$IMAGE_DIGEST" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": ".github/workflows/preproduction-rehearsal.yml",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "controlSha": os.environ["CONTROL_SHA"],
              "candidateSha": os.environ["CANDIDATE_SHA"],
              "imageTag": os.environ["IMAGE_TAG"],
              "imageDigest": os.environ["IMAGE_DIGEST"],
          }
          destination = Path(os.environ["PROOF_DIRECTORY"]) / "rehearsal-proof.json"
          destination.write_text(json.dumps(proof, separators=(",", ":")), encoding="utf-8")
          PY
      - name: Preserve successful rehearsal proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preproduction-rehearsal-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preproduction-rehearsal-proof/rehearsal-proof.json
          if-no-files-found: error
          retention-days: 30
